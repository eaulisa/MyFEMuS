name: CutFEM fastgraph final validation

on:
  push:
    branches:
      - rifat-cutfem-fastgraph-result
      - rifat-cutfem-hex-tet-result
    paths:
      - 'src/quadrature/cutfem_ls/**'
      - 'unittests/testCutFemWeightLSNative/**'
      - '.github/workflows/cutfem-fastgraph-final.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Mark validation pending
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('unittests/testCutFemWeightLSNative/review_results/acceptance.json')
          path.write_text(json.dumps({'accepted': False, 'status': 'pending', 'input_sha': os.environ['GITHUB_SHA']}, indent=2) + '\n')
          PY
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ python3 python3-numpy python3-mpmath libboost-dev libeigen3-dev
      - name: Build native suite
        working-directory: unittests/testCutFemWeightLSNative
        run: python3 build.py --jobs 2
      - name: Run focused native suite
        working-directory: unittests/testCutFemWeightLSNative
        run: python3 run_focused.py --extended
      - name: Run native and planar matrices
        working-directory: unittests/testCutFemWeightLSNative
        run: |
          python3 run.py --selection original
          python3 run.py --selection supplemental
          python3 compare_planar.py
      - name: Run degree-10 review, sanitizers, and pinned benchmarks
        run: python3 unittests/testCutFemWeightLSNative/run_review_validation.py
      - name: Run HEX/TET graph splitting, refinement, and pinned timings
        run: python3 unittests/testCutFemWeightLSNative/run_hex_tet_validation.py
      - name: Run non-graph enriched HEX/TET checks
        run: python3 unittests/testCutFemWeightLSNative/validate_enriched_3d.py
      - name: Print validation results
        if: always()
        run: |
          cat unittests/testCutFemWeightLSNative/review_results/acceptance.json || true
          cat unittests/testCutFemWeightLSNative/review_results/hex_tet_summary.json || true
          cat unittests/testCutFemWeightLSNative/review_results/enriched_3d_summary.json || true
