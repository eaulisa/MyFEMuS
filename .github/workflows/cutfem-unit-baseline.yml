name: CutFEM unit-cell baseline

on:
  push:
    branches:
      - rifat-cutfem-hex-tet-result
    paths:
      - 'src/quadrature/cutfem_ls/**'
      - 'unittests/testCutFemWeightLSNative/**'
      - '.github/workflows/cutfem-unit-baseline.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: unittests/testCutFemWeightLSNative
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ python3 python3-numpy python3-mpmath libboost-dev libeigen3-dev
      - name: Build with actual FEMuS bases and quadrature
        run: python3 build.py --jobs 2
      - name: Run established regression and fitting checks
        run: |
          python3 run.py --selection original
          python3 run.py --selection supplemental
          python3 run_focused.py --extended
          python3 compare_planar.py
          python3 run_wide_double_output.py --jobs 2
      - name: Check unit moments and fitted weights in two and three dimensions
        run: python3 run_wide_unit_validation.py --jobs 3
      - name: Check refined physical circle and sphere meshes
        run: python3 run_wide_unit_mesh.py --jobs 3
      - name: Check graph partitions and enriched non-graph fields
        run: |
          ./build/graph_cell_splitting 2
          ./build/graph_cell_splitting 6
          ./build/graph_cell_splitting 10
          python3 validate_enriched_3d.py
      - name: Check splitting and fitting with ASan and UBSan
        run: python3 run_wide_unit_sanitizers.py --leak-detection
      - name: Upload numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutfem-unit-baseline-${{ github.sha }}
          path: |
            unittests/testCutFemWeightLSNative/review_results/wide_unit*.json
            unittests/testCutFemWeightLSNative/results/wide_unit*/
            unittests/testCutFemWeightLSNative/results/wide_double_output/
            unittests/testCutFemWeightLSNative/results/enriched_3d/
            unittests/testCutFemWeightLSNative/candidate_*_summary.json
            unittests/testCutFemWeightLSNative/extended_results.json
            unittests/testCutFemWeightLSNative/planar_comparison_results.json
          if-no-files-found: error
