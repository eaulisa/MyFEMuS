name: CutFEM review validation
on:
  push:
    branches: [rifat-cutfem-review-validation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ python3 python3-numpy python3-mpmath libboost-dev libeigen3-dev
      - name: Apply pinned review repairs
        run: |
          python3 unittests/testCutFemWeightLSNative/apply_review_fixes.py
          python3 unittests/testCutFemWeightLSNative/finish_review_fixes.py
          test ! -f unittests/testCutFemWeightLSNative/polish_review_fixes.py || python3 unittests/testCutFemWeightLSNative/polish_review_fixes.py
      - name: Export minimal numerical workspace
        run: |
          mkdir -p /tmp/cutfem-review-export/candidate/src /tmp/cutfem-review-export/candidate/unittests /tmp/cutfem-review-export/baseline /tmp/cutfem-review-export/reviewed
          cp -r src/quadrature src/fe src/enums /tmp/cutfem-review-export/candidate/src/
          cp -r unittests/testCutFemWeightLSNative /tmp/cutfem-review-export/candidate/unittests/
          cp -r /usr/include/eigen3 /tmp/cutfem-review-export/
          git fetch --depth=1 origin 0ff0669494e603be248d02c44c0a2e9b81f72b4d 39bdedb4b93e6e5f7a21ab4a154eaf3e3538fdaa
          git archive 0ff0669494e603be248d02c44c0a2e9b81f72b4d src/quadrature src/fe src/enums | tar -xf - -C /tmp/cutfem-review-export/baseline
          git archive 39bdedb4b93e6e5f7a21ab4a154eaf3e3538fdaa src/quadrature src/fe src/enums | tar -xf - -C /tmp/cutfem-review-export/reviewed
          tar -czf /tmp/cutfem-review-workspace.tar.gz -C /tmp cutfem-review-export
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-workspace-${{ github.sha }}
          path: /tmp/cutfem-review-workspace.tar.gz
      - name: Build native suite
        id: build
        working-directory: unittests/testCutFemWeightLSNative
        run: python3 build.py --jobs 2
      - name: Run native focused and original matrix
        id: native
        continue-on-error: true
        working-directory: unittests/testCutFemWeightLSNative
        run: |
          python3 run_focused.py
          python3 run.py --selection original
      - name: Run review regressions and benchmark gate
        id: review
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 unittests/testCutFemWeightLSNative/run_review_validation.py
      - name: Preserve generated source snapshot
        if: always()
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          git config user.name 'CutFEM validation'
          git config user.email 'cutfem-validation@users.noreply.github.com'
          git add src/quadrature/cutfem_ls unittests/testCutFemWeightLSNative/*.cpp unittests/testCutFemWeightLSNative/*.py
          git reset -- .github/workflows unittests/testCutFemWeightLSNative/build || true
          for f in acceptance.json environment.json source_manifest.json comparison_baseline.json comparison_reviewed.json; do
            test ! -f unittests/testCutFemWeightLSNative/review_results/$f || git add -f unittests/testCutFemWeightLSNative/review_results/$f
          done
          git diff --cached --quiet || git commit -m "Review validation source from ${INPUT_SHA}"
          git push origin HEAD:refs/heads/review-result-${INPUT_SHA:0:12}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutfem-review-results-${{ github.sha }}
          path: |
            unittests/testCutFemWeightLSNative/*results*.json
            unittests/testCutFemWeightLSNative/review_results/**
            unittests/testCutFemWeightLSNative/build/*.log
      - name: Final acceptance gate
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          REVIEW: ${{ steps.review.outcome }}
        run: |
          test "$BUILD" = success
          test "$NATIVE" = success
          test "$REVIEW" = success
