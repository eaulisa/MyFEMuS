name: Native CutFEM endpoint integration
on:
  push:
    branches: [rifat-cutfem-endpoint-only]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake python3 python3-numpy python3-mpmath libboost-dev libeigen3-dev
      - name: Configure maintained tests
        run: cmake -S unittests/testCutFemWeightLSNative -B build-cutfem -DCMAKE_BUILD_TYPE=Release
      - name: Build maintained tests
        run: cmake --build build-cutfem --parallel 2
      - name: Run maintained tests
        run: ctest --test-dir build-cutfem --output-on-failure
      - name: Build wider numerical checks
        run: python3 unittests/testCutFemWeightLSNative/build.py --jobs 2
      - name: Run original, focused, and endpoint geometry checks
        working-directory: unittests/testCutFemWeightLSNative
        run: |
          python3 run.py --selection original --jobs 2
          python3 run_focused.py --extended --jobs 2
          python3 run_endpoint_strip_comparison.py --skip-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-test-logs
          path: |
            build-cutfem/Testing/Temporary/LastTest.log
            unittests/testCutFemWeightLSNative/candidate_original_summary.json
            unittests/testCutFemWeightLSNative/extended_results.json
            unittests/testCutFemWeightLSNative/endpoint_only_results/endpoint_strip_comparison.json
