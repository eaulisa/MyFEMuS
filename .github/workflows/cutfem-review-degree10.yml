name: CutFEM degree-10 review rerun

on:
  push:
    branches:
      - review-rerun-degree10-32c0e94
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ python3 python3-numpy python3-mpmath libboost-dev libeigen3-dev
      - name: Build native suite
        working-directory: unittests/testCutFemWeightLSNative
        run: python3 build.py --jobs 2
      - name: Run focused native suite
        working-directory: unittests/testCutFemWeightLSNative
        run: python3 run_focused.py --extended
      - name: Run original native matrix
        working-directory: unittests/testCutFemWeightLSNative
        run: python3 run.py --selection original
      - name: Run review regressions and strict benchmark gate
        run: python3 unittests/testCutFemWeightLSNative/run_review_validation.py
      - name: Show acceptance
        if: always()
        run: cat unittests/testCutFemWeightLSNative/review_results/acceptance.json || true
